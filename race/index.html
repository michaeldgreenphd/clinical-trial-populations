<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Static GitHub Pages redirect: /race -> the hash route the app handles. -->
    <meta http-equiv="refresh" content="0; url=/#race">
    <script>location.replace('/#race' + location.search + (location.hash || ''));</script>
    <title>Civic Sample &mdash; Race</title>
</head>
<body>
    <p>Redirecting&hellip; <a href="/#race">Continue to the Race view</a></p>
</body>
</html>
