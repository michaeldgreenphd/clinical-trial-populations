name: Run Extraction Pipelines

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Which extraction stream(s) to run"
        required: true
        type: choice
        default: all
        options:
          - all
          - fda-only
          - aiml-lit-only
          - trials-lit-only
      run_mode:
        description: "Pilot test (caps: 8 FDA, 8 AIML, 20 Trials) or full extraction"
        required: true
        type: choice
        default: pilot-test
        options:
          - pilot-test
          - full-extraction
      ai_provider:
        description: 'Which AI provider to use *'
        required: true
        type: choice
        default: anthropic
        options:
          - anthropic
          - vertex_gemini
      gemini_version:
        description: 'Which Gemini model family to use (only applies when ai_provider=vertex_gemini)'
        required: true
        type: choice
        default: gemini-3-preview
        options:
          - gemini-2.5-stable
          - gemini-3-preview
          - N/A - using Claude

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate provider / Gemini-version pairing
        run: |
          if [ "${{ inputs.ai_provider }}" = "vertex_gemini" ] && [ "${{ inputs.gemini_version }}" = "N/A - using Claude" ]; then
            echo "::error::Input mismatch: ai_provider='vertex_gemini' requires a real Gemini model family, but gemini_version is set to 'N/A - using Claude'."
            echo "::error::Pick gemini-2.5-stable or gemini-3-preview for Vertex runs, or switch ai_provider to 'anthropic'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set current date
        run: echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/extraction/requirements.txt

      - name: Authenticate Vertex AI
        if: ${{ github.event.inputs.ai_provider == 'vertex_gemini' }}
        run: |
          echo '${{ secrets.VERTEX_CREDENTIALS_JSON }}' > vertex_key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/vertex_key.json" >> $GITHUB_ENV
          echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" >> $GITHUB_ENV

      - name: Run FDA Demographics Extraction
        if: inputs.pipeline == 'all' || inputs.pipeline == 'fda-only'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ inputs.ai_provider }}
          GEMINI_VERSION: ${{ inputs.gemini_version }}
          RUN_MODE: ${{ inputs.run_mode }}
        run: python scripts/extraction/extract_fda_demographics.py | tee fda_extraction_log.txt

      - name: Upload FDA Logs to Google Drive via OAuth
        if: always()
        env:
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          CHILD_FOLDER: FDA_Summary_Extractions
          FILE_PATH: ${{ github.workspace }}/fda_extraction_log.txt
          FILE_NAME: ${{ env.CURRENT_DATE }}_FDA_extraction_log.txt
        run: |
          pip install requests
          python scripts/gdrive_upload.py

      # FDA extraction data files now ship with dynamic
      # `fda_extracted_{provider}_{YYYY-MM-DD_HHMM_TZ}` filenames so two
      # back-to-back runs never overwrite each other. We loop the glob
      # rather than naming a single FILE_PATH so each artifact lands in
      # Drive under its own timestamp. `nullglob` keeps the loop a no-op
      # when a particular run produced no files (e.g. fda-only was off).
      - name: Upload FDA Extraction Data to Google Drive via OAuth
        if: always()
        env:
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          CHILD_FOLDER: FDA_Summary_Extractions
        run: |
          pip install requests
          shopt -s nullglob
          matched=0
          for f in data/fda_extracted_*.csv data/fda_metrics_*.json; do
            [ -f "$f" ] || continue
            matched=$((matched + 1))
            FILE_PATH="${GITHUB_WORKSPACE}/$f" \
            FILE_NAME="$(basename "$f")" \
            python scripts/gdrive_upload.py
          done
          echo "Uploaded ${matched} FDA extraction artifact(s)."

      - name: Run AI/ML Literature Extraction
        if: inputs.pipeline == 'all' || inputs.pipeline == 'aiml-lit-only'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ inputs.ai_provider }}
          GEMINI_VERSION: ${{ inputs.gemini_version }}
          RUN_MODE: ${{ inputs.run_mode }}
        run: python scripts/extraction/extract_paper_ses.py | tee aiml_extraction_log.txt

      - name: Upload AI/ML Logs to Google Drive via OAuth
        if: always()
        env:
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          CHILD_FOLDER: AIML_Literature_Extractions
          FILE_PATH: ${{ github.workspace }}/aiml_extraction_log.txt
          FILE_NAME: ${{ env.CURRENT_DATE }}_AIML_extraction_log.txt
        run: |
          pip install requests
          python scripts/gdrive_upload.py

      - name: Run Clinical Trials Literature Extraction
        if: inputs.pipeline == 'all' || inputs.pipeline == 'trials-lit-only'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ inputs.ai_provider }}
          GEMINI_VERSION: ${{ inputs.gemini_version }}
          RUN_MODE: ${{ inputs.run_mode }}
        run: python scripts/extraction/extract_trial_papers.py | tee trials_extraction_log.txt

      - name: Upload Trials Logs to Google Drive via OAuth
        if: always()
        env:
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          CHILD_FOLDER: Trials_Literature_Extractions
          FILE_PATH: ${{ github.workspace }}/trials_extraction_log.txt
          FILE_NAME: ${{ env.CURRENT_DATE }}_Trials_extraction_log.txt
        run: |
          pip install requests
          python scripts/gdrive_upload.py

      # Literature extraction data files use the same dynamic
      # `lit_extracted_{provider}_{YYYY-MM-DD_HHMM_TZ}` naming, so we glob
      # both AIML and Clinical Trials manuscript artifacts together. The
      # CHILD_FOLDER is the catch-all `Literature_Extractions` to match the
      # single `lit_*` pattern called out in the task spec.
      - name: Upload Literature Extraction Data to Google Drive via OAuth
        if: always()
        env:
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          CHILD_FOLDER: Literature_Extractions
        run: |
          pip install requests
          shopt -s nullglob
          matched=0
          for f in data/lit_extracted_*.csv data/lit_metrics_*.json; do
            [ -f "$f" ] || continue
            matched=$((matched + 1))
            FILE_PATH="${GITHUB_WORKSPACE}/$f" \
            FILE_NAME="$(basename "$f")" \
            python scripts/gdrive_upload.py
          done
          echo "Uploaded ${matched} literature extraction artifact(s)."

      - name: Upload Token Cost Tracker to Google Drive via OAuth
        if: always() && hashFiles('data/token_costs.csv') != ''
        env:
          CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          CHILD_FOLDER: Token_Cost_Tracking
          FILE_PATH: ${{ github.workspace }}/data/token_costs.csv
        run: |
          pip install requests
          # FILE_NAME is computed inline so the upload includes the
          # America/New_York wall-clock time (24h, with the live EST/EDT
          # abbreviation). Two runs on the same day no longer overwrite
          # each other's snapshot in Drive.
          export FILE_NAME="$(TZ='America/New_York' date +'%Y-%m-%d_%H%M_%Z')_token_costs.csv"
          python scripts/gdrive_upload.py

      - name: Commit extraction results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage whatever actually landed on disk. Wildcards + the
          # `|| true` fallback mean a missing stream (e.g. the trials
          # manuscript PDFs weren't present on the runner) doesn't abort
          # the whole commit — the streams that did produce output still
          # get committed.
          # Three filename conventions live side by side here:
          #   * legacy static names from scripts/extraction/* —
          #     `data/*_extracted.json` + `data/*_token_metrics.json`
          #   * dynamic timestamped names from extraction_pipeline/* —
          #     `data/{fda,lit}_extracted_*.csv`
          #     `data/{fda,lit}_metrics_*.json`
          #   * stable `_latest` aliases written alongside each
          #     timestamped artifact — `data/*_latest.csv`
          #     + `data/*_latest.json`. These are the patterns that
          #     guarantee Git detects changes (timestamped names always
          #     differ, so Git sees them as untracked-but-not-tracked
          #     additions; the `_latest` aliases overwrite themselves so
          #     the diff reliably trips a commit and Pages deploy.)
          git add \
            data/*_extracted.json \
            data/*_token_metrics.json \
            data/fda_extracted_*.csv \
            data/fda_metrics_*.json \
            data/lit_extracted_*.csv \
            data/lit_metrics_*.json \
            data/*_latest.csv \
            data/*_latest.json \
            2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update extraction data from CI pipeline run

            Triggered by: ${{ github.actor }}
            Pipeline: ${{ inputs.pipeline }}
            Run mode: ${{ inputs.run_mode }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push
          fi
