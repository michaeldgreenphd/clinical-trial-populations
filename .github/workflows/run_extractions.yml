name: Run Extraction Pipelines

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Which extraction stream(s) to run"
        required: true
        type: choice
        default: all
        options:
          - all
          - fda-only
          - aiml-lit-only
          - trials-lit-only
      run_mode:
        description: "Pilot test (cap at 2 docs per stream) or full extraction"
        required: true
        type: choice
        default: pilot-test
        options:
          - pilot-test
          - full-extraction

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/extraction/requirements.txt

      - name: Run FDA Demographics Extraction
        if: inputs.pipeline == 'all' || inputs.pipeline == 'fda-only'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_MODE: ${{ inputs.run_mode }}
        run: python scripts/extraction/extract_fda_demographics.py

      - name: Run AI/ML Literature Extraction
        if: inputs.pipeline == 'all' || inputs.pipeline == 'aiml-lit-only'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_MODE: ${{ inputs.run_mode }}
        run: python scripts/extraction/extract_paper_ses.py

      - name: Run Clinical Trials Literature Extraction
        if: inputs.pipeline == 'all' || inputs.pipeline == 'trials-lit-only'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_MODE: ${{ inputs.run_mode }}
        run: python scripts/extraction/extract_trial_papers.py

      - name: Commit extraction results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage whatever actually landed on disk. Wildcards + the
          # `|| true` fallback mean a missing stream (e.g. the trials
          # manuscript PDFs weren't present on the runner) doesn't abort
          # the whole commit — the streams that did produce output still
          # get committed.
          git add data/*_extracted.json data/*_token_metrics.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update extraction data from CI pipeline run

            Triggered by: ${{ github.actor }}
            Pipeline: ${{ inputs.pipeline }}
            Run mode: ${{ inputs.run_mode }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push
          fi
