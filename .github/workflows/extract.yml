name: Extract Demographics Data

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 6 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml rapidfuzz tqdm

      - name: Run extraction
        run: python -m src.extract_all --output data/demographics.json --results-after 2009-01-01

      - name: Commit and push data
        run: |
          # Compress the JSON file to reduce size
          gzip -9 -f data/demographics.json

          # Create a release with the data file
          RELEASE_TAG="data-$(date +'%Y-%m-%d-%H%M%S')"
          gh release create "$RELEASE_TAG" \
            data/demographics.json.gz \
            --title "Data Extract $(date +'%Y-%m-%d')" \
            --notes "Automated data extraction: All studies with results from 2009 forward. Extracted $(date +'%Y-%m-%d %H:%M:%S UTC')"

          # Update pointer file to latest release
          echo "$RELEASE_TAG" > data/latest-release.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest-release.txt
          git commit -m "Update data pointer to release $RELEASE_TAG" || exit 0
          git push
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Trigger dashboard rebuild
        run: |
          git fetch origin dashboard
          git checkout dashboard
          git merge main --no-edit --allow-unrelated-histories -X theirs || {
            # If merge fails due to conflicts, resolve by keeping data/ from main
            git checkout --theirs data/
            git checkout --ours README.md || true
            git add .
            git commit -m "Merge main into dashboard: update data, keep dashboard README"
          }
          git push
