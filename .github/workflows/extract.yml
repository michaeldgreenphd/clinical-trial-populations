name: Extract Demographics Data

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 6 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml rapidfuzz tqdm

      - name: Run extraction
        run: python src/extract_all.py --output data/

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update demographics data $(date +'%Y-%m-%d')" || exit 0
          git push

      - name: Trigger dashboard rebuild
        run: |
          git checkout dashboard
          git merge main --no-edit
          git push
