name: Extract Demographics Data

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 6 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and push commits

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml rapidfuzz tqdm

      - name: Run extraction
        run: python -m src.extract_all --output data/demographics.json --results-after 2009-01-01

      - name: Commit and push data
        run: |
          # Split JSON into 2 parts to stay under GitHub's 100MB limit
          python3 scripts/split_data.py

          PART1_SIZE=$(du -h data/demographics.part1.json.gz | cut -f1)
          PART2_SIZE=$(du -h data/demographics.part2.json.gz | cut -f1)
          echo "Part 1 size: $PART1_SIZE"
          echo "Part 2 size: $PART2_SIZE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/demographics.part*.json.gz

          # Remove the original JSON file if it exists
          rm -f data/demographics.json
          git rm --ignore-unmatch data/demographics.json

          TIMESTAMP=$(date +'%Y-%m-%d')
          git commit -m "Update demographics data $TIMESTAMP (Part1: $PART1_SIZE, Part2: $PART2_SIZE)" || exit 0
          git push
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Capture extraction date
        if: github.event_name == 'schedule'
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create release and upload data snapshots
        if: github.event_name == 'schedule'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: Demographics snapshot ${{ steps.date.outputs.date }}
          files: |
            data/demographics.part1.json.gz
            data/demographics.part2.json.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Update history manifest and push
        if: github.event_name == 'schedule'
        run: |
          DATE="${{ steps.date.outputs.date }}"

          # Append date to history.json, creating the file if missing
          if [ ! -f history.json ]; then
            echo '{"dates":[]}' > history.json
          fi
          jq --arg d "$DATE" '.dates += [$d] | .dates |= unique' history.json > history.json.tmp
          mv history.json.tmp history.json

          git add history.json
          git commit -m "Archive demographics snapshot $DATE in history manifest" || exit 0
          git push
        env:
          GH_TOKEN: ${{ github.token }}

