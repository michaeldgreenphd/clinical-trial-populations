name: Extract Demographics Data

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 6 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and push commits

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml rapidfuzz tqdm

      - name: Run extraction
        run: python -m src.extract_all --output data/demographics.json --results-after 2009-01-01

      - name: Split and commit data
        run: |
          # Split JSON into 8 parts so each stays under jsDelivr's 20 MB limit
          python3 scripts/split_data.py

          # Show sizes
          for f in data/demographics.part*.json.gz; do
            echo "$(basename $f): $(du -h "$f" | cut -f1)"
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage new parts and remove any old 2-part leftovers
          git add data/demographics.part*.json.gz

          # Remove the original JSON file if it exists
          rm -f data/demographics.json
          git rm --ignore-unmatch data/demographics.json

          TIMESTAMP=$(date +'%Y-%m-%d')
          git commit -m "Update demographics data $TIMESTAMP" || exit 0
          git push
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Capture extraction date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create release and upload data snapshots
        run: |
          DATE="${{ steps.date.outputs.date }}"

          # Delete any existing release for this date (re-runs should overwrite)
          gh release delete "$DATE" --yes 2>/dev/null || true

          # Create a new release with all part files as assets
          gh release create "$DATE" \
            --title "Demographics snapshot $DATE" \
            --notes "Weekly demographics extraction from ClinicalTrials.gov" \
            data/demographics.part*.json.gz

          echo "✓ Release $DATE created."

          # Verify assets were uploaded
          ASSET_COUNT=$(gh release view "$DATE" --json assets --jq '.assets | length')
          echo "✓ Release has ${ASSET_COUNT} assets."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update history manifest
        run: |
          DATE="${{ steps.date.outputs.date }}"

          # Append date to history.json, creating the file if missing
          if [ ! -f history.json ]; then
            echo '{"dates":[]}' > history.json
          fi
          jq --arg d "$DATE" '.dates += [$d] | .dates |= unique' history.json > history.json.tmp
          mv history.json.tmp history.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Archive demographics snapshot $DATE in history manifest" || exit 0
          git push
        env:
          GH_TOKEN: ${{ github.token }}
