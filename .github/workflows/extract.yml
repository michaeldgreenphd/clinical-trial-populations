name: Extract Demographics Data

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 6 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and push commits

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml rapidfuzz tqdm

      - name: Run extraction
        run: python -m src.extract_all --output data/demographics.json --results-after 2009-01-01

      - name: Commit and push data
        run: |
          # Split JSON into 2 parts to stay under GitHub's 100MB limit
          echo "Splitting and compressing data file..."
          python3 << 'EOF'
import json
import gzip

# Load the full dataset
with open('data/demographics.json', 'r') as f:
    full_data = json.load(f)

total_studies = len(full_data['data'])
mid_point = total_studies // 2

# Split into two parts
part1 = {
    'extracted_at': full_data['extracted_at'],
    'part': 1,
    'total_parts': 2,
    'data': full_data['data'][:mid_point]
}

part2 = {
    'extracted_at': full_data['extracted_at'],
    'part': 2,
    'total_parts': 2,
    'data': full_data['data'][mid_point:]
}

# Compress and save
with gzip.open('data/demographics.part1.json.gz', 'wt', compresslevel=9) as f:
    json.dump(part1, f, separators=(',', ':'))

with gzip.open('data/demographics.part2.json.gz', 'wt', compresslevel=9) as f:
    json.dump(part2, f, separators=(',', ':'))

print(f'Split {total_studies} studies into 2 parts of {mid_point} and {total_studies - mid_point}')
EOF

          PART1_SIZE=$(du -h data/demographics.part1.json.gz | cut -f1)
          PART2_SIZE=$(du -h data/demographics.part2.json.gz | cut -f1)
          echo "Part 1 size: $PART1_SIZE"
          echo "Part 2 size: $PART2_SIZE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/demographics.part*.json.gz
          git rm data/demographics.json --ignore-unmatch || true

          TIMESTAMP=$(date +'%Y-%m-%d')
          git commit -m "Update demographics data $TIMESTAMP (Part1: $PART1_SIZE, Part2: $PART2_SIZE)" || exit 0
          git push
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Trigger dashboard rebuild
        run: |
          git fetch origin dashboard
          git checkout dashboard
          git merge main --no-edit --allow-unrelated-histories -X theirs || {
            # If merge fails due to conflicts, resolve by keeping data/ from main
            git checkout --theirs data/
            git checkout --ours README.md || true
            git add .
            git commit -m "Merge main into dashboard: update data, keep dashboard README"
          }
          git push
