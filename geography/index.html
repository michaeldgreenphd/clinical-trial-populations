<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Static GitHub Pages redirect: /geography -> the hash route the app handles. -->
    <meta http-equiv="refresh" content="0; url=/#geography">
    <script>location.replace('/#geography' + location.search + (location.hash || ''));</script>
    <title>Civic Sample &mdash; Geography</title>
</head>
<body>
    <p>Redirecting&hellip; <a href="/#geography">Continue to the Geography view</a></p>
</body>
</html>
