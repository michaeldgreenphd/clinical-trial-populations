<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Static GitHub Pages redirect: /gender -> the hash route the app handles. -->
    <meta http-equiv="refresh" content="0; url=/#gender">
    <script>location.replace('/#gender' + location.search + (location.hash || ''));</script>
    <title>Civic Sample &mdash; Gender</title>
</head>
<body>
    <p>Redirecting&hellip; <a href="/#gender">Continue to the Gender view</a></p>
</body>
</html>
