<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Static GitHub Pages redirect: /faq -> the hash route the app handles. -->
    <meta http-equiv="refresh" content="0; url=/#faq">
    <script>location.replace('/#faq' + location.search + (location.hash || ''));</script>
    <title>Civic Sample &mdash; FAQ</title>
</head>
<body>
    <p>Redirecting&hellip; <a href="/#faq">Continue to the FAQ view</a></p>
</body>
</html>
